version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solvebounty}
      POSTGRES_USER: ${POSTGRES_USER:-solvebounty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solvebountypass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solvebounty}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infrastructure/docker/api.Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://${POSTGRES_USER:-solvebounty}:${POSTGRES_PASSWORD:-solvebountypass}@postgres:5432/${POSTGRES_DB:-solvebounty}
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build:
      context: ./apps/api
      dockerfile: ../../infrastructure/docker/api.Dockerfile
    command: celery -A config worker -l info
    volumes:
      - ./apps/api:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://${POSTGRES_USER:-solvebounty}:${POSTGRES_PASSWORD:-solvebountypass}@postgres:5432/${POSTGRES_DB:-solvebounty}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - api
      - redis

  ai:
    build:
      context: ./apps/ai
      dockerfile: ../../infrastructure/docker/ai.Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    volumes:
      - ./apps/ai:/app
    ports:
      - "8001:8001"

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/web.Dockerfile
    command: npm run dev
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_AI_URL=http://localhost:8001/ai/v1
    depends_on:
      - api

volumes:
  postgres_data:
